<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meantor</title>
  <meta name="description" content="Meantor: a mentor for freelancers who want to close more clients.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #f6f7f9;
      --fg: #16202b;
      --muted: #5b6876;
      --accent: #1f6f5c;
      --line: #dde2e8;
      --display: "Fraunces", Georgia, serif;
      --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11171d; --fg: #e8edf2; --muted: #9aa7b4; --accent: #5cc4a6; --line: #26313b; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 400 1.05rem/1.6 var(--body);
      display: grid;
      place-items: center;
      padding: 2rem max(16px, env(safe-area-inset-left, 0px));
    }
    main { max-width: 34rem; display: grid; gap: 1.25rem; }
    .status {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .8rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
      color: var(--accent);
    }
    .status::before {
      content: ""; width: .55rem; height: .55rem; border-radius: 50%;
      background: var(--accent);
    }
    h1 {
      margin: 0;
      font: 600 clamp(2.6rem, 9vw, 4rem)/1.05 var(--display);
      letter-spacing: -.01em;
      text-wrap: balance;
    }
    p { margin: 0; color: var(--muted); }
    footer {
      border-top: 1px solid var(--line);
      padding-top: 1rem;
      font-size: .85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <span class="status">Deployment test</span>
    <h1>Meantor</h1>
    <p>A mentor for freelancers who want to close more clients. This is a placeholder page to confirm the site is live; the real app is on its way.</p>
    <footer>If you can read this, the deploy worked.</footer>
  </main>
</body>
</html>
